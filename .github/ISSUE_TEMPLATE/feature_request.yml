name: Feature request
description: Suggest an improvement or a new capability
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that Noesis makes hard today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should Noesis do? API / CLI / MCP sketches welcome.
  - type: textarea
    id: evidence
    attributes:
      label: How would we know it works?
      description: A test, a benchmark metric, or an example corpus that would show the improvement.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - ingestion / loaders
        - understanding map (claims, evidence, contradictions)
        - beliefs / calibration
        - reasoning loop (think / ask / explain)
        - model adapters
        - MCP server
        - CLI / reports
        - benchmarks / docs
